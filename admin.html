<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Administrace - Půjčovna</title>

<style>
:root {
    --primary: #0284c7;
    --primary-dark: #0369a1;
    --dark: #0f172a;
    --gray: #64748b;
    --light: #f8fafc;
    --border: #e2e8f0;
    --success: #16a34a;
    --danger: #dc2626;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    background-color: var(--light);
    color: var(--dark);
    line-height: 1.6;
    padding: 20px 10px;
    display: flex;
    justify-content: center;
}
.wrapper { max-width: 800px; width: 100%; display: flex; flex-direction: column; gap: 20px; }
.app-header { display: flex; justify-content: space-between; align-items: center; padding: 0 5px; }
.app-header h1 { font-size: 1.5rem; font-weight: 800; color: var(--dark); }
.card {
    background: #ffffff;
    border-radius: 16px;
    box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
    padding: 20px;
    border: 1px solid var(--border);
}
.section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 15px; }
.form-group { margin-bottom: 15px; }
.form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 6px; color: var(--dark); }
.form-group input, .form-group textarea { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; font-size: 0.95rem; font-family: inherit; }
.btn {
    background-color: var(--primary); color: white; border: none; border-radius: 8px; padding: 12px 20px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%;
}
.btn:hover { background-color: var(--primary-dark); }
.btn-danger { background-color: var(--danger); }
.btn-danger:hover { background-color: #b91c1c; }
.btn-secondary { background-color: var(--gray); }

/* Styly pro objednávky */
.order-card { background: #fff; border: 1px solid var(--border); border-radius: 12px; padding: 16px; margin-bottom: 12px; }
.order-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 8px; margin-bottom: 10px; font-size: 0.9rem; }
.order-items { font-size: 0.9rem; margin-bottom: 10px; background: var(--light); padding: 10px; border-radius: 8px; }
.order-client { font-size: 0.85rem; color: var(--gray); margin-bottom: 12px; }
.order-actions { display: flex; gap: 8px; justify-content: flex-end; align-items: center; }

.admin-product-item {
    display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px;
}
.admin-product-item img { width: 50px; height: 50px; object-fit: contain; background: #fff; border: 1px solid var(--border); border-radius: 6px; flex-shrink: 0; }
.admin-product-info { flex: 1; }
.admin-product-title { font-weight: 700; font-size: 0.95rem; }
.admin-product-details { font-size: 0.8rem; color: var(--gray); }
.admin-actions { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; }
.action-link { font-size: 0.75rem; color: var(--primary); text-decoration: none; font-weight: 600; cursor: pointer; }
.action-link:hover { text-decoration: underline; }
.action-link-danger { color: var(--danger); }

/* Přihlašovací overlay */
#auth-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(5px);
    display: flex; justify-content: center; align-items: center; z-index: 9999;
}
.auth-box {
    background: #ffffff; padding: 30px; border-radius: 16px; width: 100%; max-width: 380px;
    box-shadow: 0 10px 30px rgba(0,0,0,0.2); display: flex; flex-direction: column; gap: 15px;
}
.auth-box h2 { font-size: 1.25rem; font-weight: 800; color: var(--dark); text-align: center; }
.auth-box p { font-size: 0.85rem; color: var(--gray); text-align: center; }

/* Styly pro tisk formuláře */
@media print {
    body { background: white; padding: 0; color: black; display: block; }
    .wrapper > *:not(.card), .app-header, #auth-overlay, .admin-actions, .order-actions, .card:not(:has(#admin-orders-list)), button, input, textarea, label { display: none !important; }
    .wrapper { max-width: 100%; display: block; }
    .card { border: none; box-shadow: none; padding: 0; }
    .order-card { border: 2px solid #000; break-inside: avoid; margin-bottom: 20px; background: white; }
    .order-header { border-bottom: 2px solid #000; }
    .order-items { background: #f1f5f9 !important; border: 1px solid #000; -webkit-print-color-adjust: exact; print-color-adjust: exact; }
    .print-form-sheet { display: block !important; }
}

.print-form-sheet { display: none; }
</style>
</head>

<body>

<!-- PŘIHLAŠOVACÍ OKNO -->
<div id="auth-overlay">
    <div class="auth-box">
        <h2>Zabezpečená administrace</h2>
        <p id="auth-instruction">Zadejte heslo pro dešifrování databáze strojů.</p>
        <div class="form-group" style="margin-bottom: 0;">
            <input type="password" id="auth-password" placeholder="Heslo..." onkeydown="if(event.key === 'Enter') handleAuth()">
        </div>
        <button type="button" class="btn" onclick="handleAuth()">Odemknout</button>
    </div>
</div>

<div class="wrapper" id="admin-content" style="display: none;">

<div class="app-header">
    <h1>Administrace půjčovny</h1>
    <div style="display: flex; gap: 15px; align-items: center;">
        <span class="action-link action-link-danger" onclick="lockAdmin()">Zamknout</span>
        <a href="index.html" class="action-link" style="font-size: 0.9rem;">← Zpět na web</a>
    </div>
</div>

<!-- SEKCE: PROVOZOVATEL PŮJČOVNY -->
<div class="card">
    <div class="section-title">🏢 Údaje o provozovateli (pro tisk smluv)</div>
    <form id="provider-form" onsubmit="saveProvider(event)">
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 2;">
                <label>Název firmy / Provozovatele</label>
                <input type="text" id="prov-name" placeholder="např. Půjčovna nářadí s.r.o." required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>IČO</label>
                <input type="text" id="prov-ico" placeholder="např. 12345678">
            </div>
        </div>
        <div class="form-group">
            <label>Sídlo / Adresa provozovny</label>
            <input type="text" id="prov-address" placeholder="např. Hlavní 123, 602 00 Brno">
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Telefon</label>
                <input type="text" id="prov-phone" placeholder="např. +420 777 888 999">
            </div>
            <div class="form-group" style="flex: 1;">
                <label>E-mail</label>
                <input type="email" id="prov-email" placeholder="např. info@pujcovna.cz">
            </div>
        </div>
        <button type="submit" class="btn" style="background-color: var(--success);">Uložit údaje provozovatele</button>
    </form>
</div>

<!-- SEKCE: PŘÍCHOZÍ OBJEDNÁVKY -->
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div class="section-title" style="margin-bottom: 0;">📦 Příchozí objednávky / poptávky</div>
        <button type="button" class="btn btn-danger" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="clearAllOrders()">Smazat všechny objednávky</button>
    </div>
    <div id="admin-orders-list">
        <p style="color:var(--gray); font-size:0.9rem;">Žádné nové objednávky.</p>
    </div>
</div>

<!-- Přidání nového stroje -->
<div class="card">
    <div class="section-title">Přidat nový stroj do nabídky</div>
    <form id="add-form" onsubmit="addNewProduct(event)">
        <div class="form-group">
            <label>Název stroje</label>
            <input type="text" id="new-name" placeholder="např. Televize" required>
        </div>
        <div class="form-group">
            <label>Popis stroje</label>
            <textarea id="new-desc" placeholder="Krátký popis..." rows="2"></textarea>
        </div>
        <div style="display: flex; gap: 10px;">
            <div class="form-group" style="flex: 1;">
                <label>Cena za den (Kč)</label>
                <input type="number" id="new-price" placeholder="např. 300" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Výše zálohy (Kč)</label>
                <input type="number" id="new-deposit" placeholder="např. 3000" required>
            </div>
            <div class="form-group" style="flex: 1;">
                <label>Počet kusů skladem</label>
                <input type="number" id="new-stock" placeholder="např. 5" required>
            </div>
        </div>
        <div class="form-group">
            <label>Fotografie stroje (vyberte obrázek)</label>
            <input type="file" id="new-img" accept="image/*" required>
        </div>
        <button type="submit" class="btn">Uložit do nabídky</button>
    </form>
</div>

<!-- Seznam existujících strojů -->
<div class="card">
    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
        <div class="section-title" style="margin-bottom: 0;">Seznam existujících strojů v nabídce</div>
        <div style="display: flex; gap: 8px;">
            <button type="button" class="btn btn-danger" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="clearAllDataItems()">Smazat vše</button>
            <button type="button" class="btn btn-secondary" style="width: auto; padding: 6px 12px; font-size: 0.8rem;" onclick="resetToDefaults()">Obnovit výchozí</button>
        </div>
    </div>
    <div id="admin-products-list"></div>
</div>

</div>

<!-- Skrytý input pro změnu fotky -->
<input type="file" id="hidden-file-input" style="display:none;" accept="image/*" onchange="handleImageChange(this)">

<script>
const defaultProducts = [
    { id: 1, name: "AKU VRTAČKA", price: 300, deposit: 3000, stock: 5, img: "vrtacka.png", desc: "Výkonná AKU vrtačka vhodná pro veškeré vrtací a šroubovací práce." },
    { id: 2, name: "MOTOROVÁ PILA", price: 350, deposit: 3000, stock: 3, img: "motorova-pila.png", desc: "Spolehlivá řetězová pila pro kácení stromů a tesařské práce." },
    { id: 3, name: "ZAHRADNÍ DRTIČ", price: 350, deposit: 3000, stock: 2, img: "zahradni-drtic.png", desc: "Kvalitní drtič větví a zahradního odpadu." },
    { id: 4, name: "VIBRAČNÍ DESKA", price: 350, deposit: 3000, stock: 1, img: "vibracni-deska.png", desc: "Vibrační deska pro zhutňování zeminy a zámkové dlažby." },
    { id: 5, name: "ÚHLOVÁ BRUSKA", price: 350, deposit: 3000, stock: 4, img: "uhlova-bruska.png", desc: "Univerzální úhlová bruska na řezání a broušení." },
    { id: 6, name: "BOURACÍ KLADIVO", price: 500, deposit: 3000, stock: 2, img: "bouraci-kladivo.png", desc: "Vysoký bourací výkon pro demolici betonových konstrukcí." },
    { id: 7, name: "ELEKTROCENTRÁLA", price: 500, deposit: 3000, stock: 2, img: "elektrocentrala.png", desc: "Záložní generátor elektrického proudu." },
    { id: 8, name: "TEPOVAČ", price: 500, deposit: 3000, stock: 6, img: "tepovac.png", desc: "Profesionální čistič koberců a čalounění." },
    { id: 9, name: "PRŮMYSLOVÝ VYSAVAČ", price: 300, deposit: 1500, stock: 4, img: "prumyslovy-vysavac.png", desc: "Vysavač pro mokré i suché vysávání." },
    { id: 10, name: "LASEROVÝ NIVELÁTOR", price: 300, deposit: 1500, stock: 2, img: "laserovy-nivelator.png", desc: "Rotační laser pro přesné zaměřování rovin." },
    { id: 11, name: "STOLNÍ PILA", price: 400, deposit: 2000, stock: 1, img: "stolni-pila.png", desc: "Přesná stolní pila s vodním chlazením." },
    { id: 13, name: "ODVLHČOVAČ", price: 300, deposit: 1500, stock: 3, img: "odvlhcovac.png", desc: "Vysokokapacitní odvlhčovač vzduchu." }
];

let products = [];
let activeEditingId = null;
let currentCryptoKey = null;

async function deriveKey(password, salt) {
    const enc = new TextEncoder();
    const keyMaterial = await window.crypto.subtle.importKey(
        "raw", enc.encode(password), { name: "PBKDF2" }, false, ["deriveKey"]
    );
    return await window.crypto.subtle.deriveKey(
        { name: "PBKDF2", salt: salt, iterations: 100000, hash: "SHA-256" },
        keyMaterial,
        { name: "AES-GCM", length: 256 },
        false,
        ["encrypt", "decrypt"]
    );
}

async function encryptData(secretData, password) {
    const salt = window.crypto.getRandomValues(new Uint8Array(16));
    const iv = window.crypto.getRandomValues(new Uint8Array(12));
    const key = await deriveKey(password, salt);
    const enc = new TextEncoder();
    const encrypted = await window.crypto.subtle.encrypt(
        { name: "AES-GCM", iv: iv },
        key,
        enc.encode(JSON.stringify(secretData))
    );
    const combined = new Uint8Array(salt.length + iv.length + encrypted.byteLength);
    combined.set(salt, 0);
    combined.set(iv, salt.length);
    combined.set(new Uint8Array(encrypted), salt.length + iv.length);
    return btoa(String.fromCharCode(...combined));
}

async function decryptData(encryptedBase64, password) {
    try {
        const binStr = atob(encryptedBase64);
        const combined = new Uint8Array(binStr.length);
        for (let i = 0; i < binStr.length; i++) {
            combined[i] = binStr.charCodeAt(i);
        }
        const salt = combined.slice(0, 16);
        const iv = combined.slice(16, 28);
        const data = combined.slice(28);
        
        const key = await deriveKey(password, salt);
        const decrypted = await window.crypto.subtle.decrypt(
            { name: "AES-GCM", iv: iv },
            key,
            data
        );
        const dec = new TextDecoder();
        return JSON.parse(dec.decode(decrypted));
    } catch (e) {
        return null;
    }
}

async function handleAuth() {
    const pwdInput = document.getElementById("auth-password").value;
    if (!pwdInput) { alert("Zadejte heslo."); return; }

    const storedEncrypted = localStorage.getItem('pujcovna_secure_data');

    if (!storedEncrypted) {
        currentCryptoKey = pwdInput;
        products = JSON.parse(JSON.stringify(defaultProducts));
        await saveAndSync();
        unlockUI();
    } else {
        const decrypted = await decryptData(storedEncrypted, pwdInput);
        if (decrypted !== null) {
            currentCryptoKey = pwdInput;
            products = decrypted.map(p => ({
                id: p.id,
                name: p.name || p.nazev || "Neznámý stroj",
                price: p.price !== undefined ? p.price : (p.cenaZaDen || 0),
                deposit: p.deposit !== undefined ? p.deposit : 0,
                stock: p.stock !== undefined ? p.stock : (p.sklad || 0),
                img: p.img || p.obrazek || "",
                desc: p.desc || ""
            }));
            unlockUI();
        } else {
            alert("Nesprávné heslo!");
            document.getElementById("auth-password").value = "";
        }
    }
}

function unlockUI() {
    document.getElementById("auth-overlay").style.display = "none";
    document.getElementById("admin-content").style.display = "flex";
    loadProviderData();
    renderAdminList();
    renderOrdersList();
}

function lockAdmin() {
    currentCryptoKey = null;
    products = [];
    document.getElementById("auth-password").value = "";
    document.getElementById("admin-content").style.display = "none";
    document.getElementById("auth-overlay").style.display = "flex";
    if (localStorage.getItem('pujcovna_secure_data')) {
        document.getElementById("auth-instruction").innerText = "Administrace byla zamčena. Zadejte heslo:";
    }
}

async function saveAndSync() {
    if (!currentCryptoKey) return;
    try {
        const encryptedString = await encryptData(products, currentCryptoKey);
        localStorage.setItem('pujcovna_secure_data', encryptedString);
        localStorage.setItem('pujcovna_data', JSON.stringify(products));
    } catch (e) {
        alert("Chyba: Úložiště je plné nebo selhalo šifrování.");
    }
}

function loadProviderData() {
    const prov = JSON.parse(localStorage.getItem('pujcovna_provider')) || {};
    document.getElementById("prov-name").value = prov.name || "";
    document.getElementById("prov-ico").value = prov.ico || "";
    document.getElementById("prov-address").value = prov.address || "";
    document.getElementById("prov-phone").value = prov.phone || "";
    document.getElementById("prov-email").value = prov.email || "";
}

function saveProvider(e) {
    e.preventDefault();
    const provider = {
        name: document.getElementById("prov-name").value.trim(),
        ico: document.getElementById("prov-ico").value.trim(),
        address: document.getElementById("prov-address").value.trim(),
        phone: document.getElementById("prov-phone").value.trim(),
        email: document.getElementById("prov-email").value.trim()
    };
    localStorage.setItem('pujcovna_provider', JSON.stringify(provider));
    alert("Údaje o provozovateli byly uloženy!");
}

function renderAdminList() {
    const list = document.getElementById("admin-products-list");
    if (!products.length) {
        list.innerHTML = `<p style="color:var(--gray); font-size:0.9rem;">Žádné stroje v nabídce.</p>`;
        return;
    }

    list.innerHTML = products.map(p => `
        <div class="admin-product-item" data-id="${p.id}">
            <img src="${p.img}" alt="" onerror="this.src='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2250%22 height=%2250%22><rect width=%22100%25%22 height=%22100%25%22 fill=%22%23eee%22/><text x=%2250%25%22 y=%2250%25%22 dominant-baseline=%22central%22 text-anchor=%22middle%22 font-size=%2210%22 fill=%22%23999%22>Foto</text></svg>'">
            <div class="admin-product-info">
                <div class="admin-product-title">${p.name}</div>
                <div class="admin-product-details">${p.price} Kč/den | Záloha: ${p.deposit} Kč | Skladem: ${p.stock} ks</div>
            </div>
            <div class="admin-actions">
                <span class="action-link" onclick="editProduct(${p.id})">Upravit</span>
                <span class="action-link" onclick="triggerImageUpload(${p.id})">Foto</span>
                <span class="action-link action-link-danger" onclick="deleteProduct(${p.id})">Smazat</span>
            </div>
        </div>
    `).join('');
}

function renderOrdersList() {
    const ordersListDiv = document.getElementById("admin-orders-list");
    const orders = JSON.parse(localStorage.getItem('pujcovna_orders')) || [];
    const prov = JSON.parse(localStorage.getItem('pujcovna_provider')) || { name: "Půjčovna nářadí", ico: "", address: "", phone: "", email: "" };

    if (orders.length === 0) {
        ordersListDiv.innerHTML = `<p style="color:var(--gray); font-size:0.9rem;">Žádné nové objednávky.</p>`;
        return;
    }

    ordersListDiv.innerHTML = orders.map((o, index) => {
        const dateStr = o.date || o.datum || "Neznámé datum";
        const clientName = o.clientName || o.customerName || "Neznámý zákazník";
        const clientType = o.clientType || o.type || "Poptávka";
        const clientAddress = o.clientAddress || o.customerAddress || "Neuvedena";
        const phone = o.phone || "Neuveden";
        const email = o.email || "Neuveden";

        let itemsFormatted = "";
        if (o.itemsText) {
            itemsFormatted = o.itemsText.replace(/\n/g, '<br>');
        } else if (Array.isArray(o.items)) {
            itemsFormatted = o.items.map(i => `• <b>${i.name || i.nazev || 'Stroj'}</b> (${i.qty || i.mnozstvi || 1} ks) — ${i.days || 1} dní — <b>${i.total || 0} Kč</b>`).join('<br>');
        } else {
            itemsFormatted = "Položky nebyly nalezeny";
        }

        return `
            <div class="order-card" id="order-card-${index}">
                <div class="print-form-sheet" style="font-size: 1rem; font-weight: 800; margin-bottom: 5px; border-bottom: 2px solid #000; padding-bottom: 8px; display: flex; justify-content: space-between;">
                    <div>
                        ${prov.name}<br>
                        <span style="font-size: 0.8rem; font-weight: normal;">Sídlo: ${prov.address || 'Neuvedeno'} | IČO: ${prov.ico || 'Neuvedeno'} | Tel: ${prov.phone || 'Neuvedeno'}</span>
                    </div>
                    <div style="text-align: right; font-size: 0.9rem;">
                        <b>VÝDEJNÍ FORMULÁŘ / SMLOUVA</b><br>
                        <span style="font-size: 0.8rem; font-weight: normal;">Datum: ${dateStr}</span>
                    </div>
                </div>
                <div class="order-header">
                    <div><b>Poptávka #${orders.length - index}</b></div>
                </div>
                <div class="order-client">
                    <b>Zákazník / Nájemce:</b> ${clientName} (${clientType})<br>
                    <b>Adresa:</b> ${clientAddress}<br>
                    <b>Kontakt:</b> ${phone} | ${email}
                </div>
                <div class="order-items">
                    <b>Položky k výpůjčce:</b><br>
                    ${itemsFormatted}
                </div>
                <div class="print-form-sheet" style="margin-top: 25px; display: flex; justify-content: space-between; font-size: 0.85rem;">
                    <div>Pronajímatel: ........................................</div>
                    <div>Nájemce (podpis): ........................................</div>
                </div>
                <div class="order-actions">
                    <button type="button" class="btn" style="width: auto; padding: 6px 14px; font-size: 0.8rem;" onclick="printOrder(${index})">🖨️ Vytisknout formulář</button>
                    <span class="action-link action-link-danger" onclick="deleteOrder(${index})" style="margin-left: 10px;">Vyřídit / Smazat</span>
                </div>
            </div>
        `;
    }).join('');
}

function printOrder(index) {
    const orders = JSON.parse(localStorage.getItem('pujcovna_orders')) || [];
    const o = orders[index];
    if (!o) return;

    const cards = document.querySelectorAll('.order-card');
    cards.forEach((card, idx) => {
        if (idx !== index) card.style.display = 'none';
    });

    window.print();

    cards.forEach(card => card.style.display = 'flex');
}

function deleteOrder(index) {
    if (confirm("Opravdu chcete tuto objednávku smazat?")) {
        let orders = JSON.parse(localStorage.getItem('pujcovna_orders')) || [];
        orders.splice(index, 1);
        localStorage.setItem('pujcovna_orders', JSON.stringify(orders));
        renderOrdersList();
    }
}

function clearAllOrders() {
    if (confirm("Opravdu chcete smazat úplně všechny objednávky?")) {
        localStorage.removeItem('pujcovna_orders');
        renderOrdersList();
    }
}

async function addNewProduct(e) {
    e.preventDefault();
    const name = document.getElementById("new-name").value.trim();
    const desc = document.getElementById("new-desc").value.trim();
    const price = parseInt(document.getElementById("new-price").value) || 0;
    const deposit = parseInt(document.getElementById("new-deposit").value) || 0;
    const stock = parseInt(document.getElementById("new-stock").value) || 0;
    const fileInput = document.getElementById("new-img");
    
    if (!fileInput.files || !fileInput.files[0]) {
        alert("Prosím vyberte fotografii stroje.");
        return;
    }

    const reader = new FileReader();
    reader.onload = async function(evt) {
        const newId = products.length > 0 ? Math.max(...products.map(p => p.id)) + 1 : 1;
        products.push({
            id: newId,
            name: name,
            price: price,
            deposit: deposit,
            stock: stock,
            img: evt.target.result,
            desc: desc
        });
        await saveAndSync();
        renderAdminList();
        document.getElementById("add-form").reset();
        alert("Stroj byl úspěšně přidán a zašifrován!");
    };
    reader.readAsDataURL(fileInput.files[0]);
}

async function editProduct(id) {
    const p = products.find(item => item.id === id);
    if (!p) return;

    const newName = prompt("Upravte název stroje:", p.name);
    if (newName === null) return;
    
    const newPrice = prompt("Upravte cenu za den (Kč):", p.price);
    if (newPrice === null) return;

    const newDeposit = prompt("Upravte výši zálohy (Kč):", p.deposit);
    if (newDeposit === null) return;

    const newStock = prompt("Upravte počet kusů skladem:", p.stock);
    if (newStock === null) return;

    const newDesc = prompt("Upravte popis stroje:", p.desc);
    if (newDesc === null) return;

    p.name = newName.trim() || p.name;
    p.price = parseInt(newPrice) || p.price;
    p.deposit = parseInt(newDeposit) || p.deposit;
    p.stock = parseInt(newStock) || p.stock;
    p.desc = newDesc.trim() !== "" ? newDesc.trim() : p.desc;

    await saveAndSync();
    renderAdminList();
    alert("Změny byly uloženy a zašifrovány!");
}

async function deleteProduct(id) {
    if (confirm("Opravdu chcete tento stroj smazat?")) {
        products = products.filter(p => p.id !== id);
        await saveAndSync();
        renderAdminList();
    }
}

async function clearAllDataItems() {
    if (confirm("Opravdu chcete vymazat úplně všechny položky?")) {
        products = [];
        await saveAndSync();
        renderAdminList();
    }
}

function triggerImageUpload(id) {
    activeEditingId = id;
    document.getElementById("hidden-file-input").click();
}

function handleImageChange(input) {
    if (input.files && input.files[0] && activeEditingId !== null) {
        const reader = new FileReader();
        reader.onload = async function(evt) {
            products = products.map(p => {
                if (p.id === activeEditingId) {
                    p.img = evt.target.result;
                }
                return p;
            });
            await saveAndSync();
            renderAdminList();
            activeEditingId = null;
            input.value = "";
            alert("Fotografie byla změněna a zašifrována!");
        };
        reader.readAsDataURL(input.files[0]);
    }
}

async function resetToDefaults() {
    if (confirm("Chcete obnovit výchozí sadu strojů?")) {
        products = JSON.parse(JSON.stringify(defaultProducts));
        await saveAndSync();
        renderAdminList();
    }
}

document.addEventListener("DOMContentLoaded", () => {
    if (!localStorage.getItem('pujcovna_secure_data')) {
        document.getElementById("auth-instruction").innerText = "Vytvořte si heslo pro zabezpečení administrace:";
    }
});
</script>
